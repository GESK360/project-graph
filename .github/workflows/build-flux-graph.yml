name: "Build Flux Graph (Windows)"

# 这个工作流只做两件事：验证源码能编译，并产出可直接安装的 NSIS 安装包。
# 不需要上游 release 流程里的云服务 secrets（LR_API_BASE_URL 缺省时前端会回落到
# https://hub.graphif.dev，见 app/src/core/service/AuthClient.tsx）。
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "feat/**"

jobs:
  windows:
    runs-on: windows-latest
    env:
      NX_DAEMON: "false"
      NX_SKIP_NX_CACHE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and packages
        run: pnpm build:no-tauri

      - name: Build Tauri app (NSIS installer)
        # createUpdaterArtifacts 需要签名私钥，fork 构建不提供密钥，这里显式关掉。
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: flux-graph-windows-nsis
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/*.exe
